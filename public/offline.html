<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <meta name="robots" content="noindex" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 2rem; }
      .card { max-width: 42rem; margin: 0 auto; border: 1px solid #ddd; border-radius: 12px; padding: 1.25rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { margin: 0.25rem 0; line-height: 1.4; }
      code { background: #f5f5f5; padding: 0.1rem 0.3rem; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sem conexão</h1>
      <p>Você está offline.</p>
      <p>Se esta tela apareceu, é porque não há dados previamente carregados em cache para esta página.</p>
      <p>Conecte-se à internet e abra novamente o app para atualizar o cache.</p>
    </div>
  </body>
</html>
