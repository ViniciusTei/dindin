name: Deploy Produção

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-main
      cancel-in-progress: false
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolver metadados do deploy
        id: deploy
        shell: bash
        run: |
          DEPLOY_COMMIT="$(node ./scripts/release/resolve-deploy-version.mjs --sha)"
          DEPLOY_VERSION="$(node ./scripts/release/resolve-deploy-version.mjs --version)"

          echo "commit=$DEPLOY_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$DEPLOY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint
        
      - name: Rodar testes de domínio
        run: npm run test:domain

      - name: Rodar testes de UI
        run: npm run test:ui

      - name: Rodar typecheck
        run: npm run typecheck

      - name: Gerar build
        env:
          APP_VERSION: ${{ steps.deploy.outputs.version }}
        run: npm run build

      - name: Deploy em produção
        shell: bash
        env:
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          APP_PORT: ${{ secrets.APP_PORT }}
          CARD_ENCRYPTION_KEY: ${{ secrets.CARD_ENCRYPTION_KEY }}
          DEPLOY_COMMIT: ${{ steps.deploy.outputs.commit }}
          APP_VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          : "${POSTGRES_USER:?Missing POSTGRES_USER secret}"
          : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD secret}"
          : "${POSTGRES_DB:?Missing POSTGRES_DB secret}"
          : "${SESSION_SECRET:?Missing SESSION_SECRET secret}"

          trap 'rm -f .env.prod' EXIT

          cat > .env.prod <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          SESSION_SECRET=${SESSION_SECRET}
          COOKIE_SECURE=${COOKIE_SECURE:-true}
          APP_PORT=${APP_PORT:-3000}
          CARD_ENCRYPTION_KEY=${CARD_ENCRYPTION_KEY:-}
          EOF

          chmod +x ./scripts/release/deploy-prod.sh
          ./scripts/release/deploy-prod.sh
