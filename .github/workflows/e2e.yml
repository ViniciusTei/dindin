name: E2E Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Wait for Postgres
        run: |
          n=0
          until pg_isready -h localhost -p 5432 -U postgres -d finance || [ $n -ge 30 ]; do
            n=$((n+1))
            sleep 1
          done
        env:
          PGPASSWORD: postgres
      - name: Run DB migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/finance
        run: npm run db:migrate
      - name: Start app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/finance
        run: npm run dev &
      - name: Wait for app
        run: |
          n=0
          until curl -sSf http://localhost:5173/ || [ $n -ge 60 ]; do
            n=$((n+1))
            sleep 1
          done
      - name: Run Playwright tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/finance
        run: npm run test:e2e -- --reporter=list
