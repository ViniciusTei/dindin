name: Deploy Produção

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-main
      cancel-in-progress: false
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolver metadados do deploy
        id: deploy
        shell: bash
        run: |
          DEPLOY_COMMIT="$(node ./scripts/release/resolve-deploy-version.mjs --sha)"
          DEPLOY_VERSION="$(node ./scripts/release/resolve-deploy-version.mjs --version)"

          echo "commit=$DEPLOY_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$DEPLOY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint
        
      - name: Rodar testes de domínio
        run: npm run test:domain

      - name: Rodar testes de UI
        run: npm run test:ui

      - name: Rodar typecheck
        run: npm run typecheck

      - name: Gerar build
        env:
          APP_VERSION: ${{ steps.deploy.outputs.version }}
        run: npm run build

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build e push da imagem Web
        env:
          APP_VERSION: ${{ steps.deploy.outputs.version }}
          REGISTRY_IMAGE: ghcr.io/${{ secrets.GHCR_USERNAME }}/financeiro-remix
        run: |
          docker build \
            --target runner \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            -t "${REGISTRY_IMAGE}:${APP_VERSION}" \
            -t "${REGISTRY_IMAGE}:latest" \
            .
          docker push "${REGISTRY_IMAGE}:${APP_VERSION}"
          docker push "${REGISTRY_IMAGE}:latest"

      - name: Build e push da imagem Migrate
        env:
          APP_VERSION: ${{ steps.deploy.outputs.version }}
          MIGRATE_IMAGE: ghcr.io/${{ secrets.GHCR_USERNAME }}/financeiro-remix-migrate
        run: |
          docker build \
            --target dev-deps \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            -t "${MIGRATE_IMAGE}:${APP_VERSION}" \
            -t "${MIGRATE_IMAGE}:latest" \
            .
          docker push "${MIGRATE_IMAGE}:${APP_VERSION}"
          docker push "${MIGRATE_IMAGE}:latest"

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REGISTRY_IMAGE: ghcr.io/${{ secrets.GHCR_USERNAME }}/financeiro-remix
          MIGRATE_IMAGE: ghcr.io/${{ secrets.GHCR_USERNAME }}/financeiro-remix-migrate
          APP_VERSION: ${{ steps.deploy.outputs.version }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USERNAME,GHCR_PAT,REGISTRY_IMAGE,MIGRATE_IMAGE,APP_VERSION,DEPLOY_DIR
          script: |
            set -e
            cd $DEPLOY_DIR

            set -a
            . ./.env.prod
            set +a

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            PREV_IMAGE=$(docker inspect financeiro-prod-web-1 --format='{{.Config.Image}}' 2>/dev/null || echo "")

            REGISTRY_IMAGE="${REGISTRY_IMAGE}:${APP_VERSION}" \
            MIGRATE_IMAGE="${MIGRATE_IMAGE}:${APP_VERSION}" \
            docker compose pull web migrate

            REGISTRY_IMAGE="${REGISTRY_IMAGE}:${APP_VERSION}" \
            MIGRATE_IMAGE="${MIGRATE_IMAGE}:${APP_VERSION}" \
            docker compose run --rm migrate

            REGISTRY_IMAGE="${REGISTRY_IMAGE}:${APP_VERSION}" \
            MIGRATE_IMAGE="${MIGRATE_IMAGE}:${APP_VERSION}" \
            docker compose up -d --no-deps web

            echo "Waiting for application to start..."
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:${APP_PORT:-3000}/health" > /dev/null; then
                echo "Health check passed. Deploy successful."
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 10s..."
              sleep 10
            done

            echo "Health check failed."
            if [ -n "$PREV_IMAGE" ]; then
              echo "Rolling back web to: $PREV_IMAGE"
              MIGRATE_IMAGE="${MIGRATE_IMAGE}:${APP_VERSION}" \
              REGISTRY_IMAGE="$PREV_IMAGE" \
              docker compose up -d --no-deps web
              echo "Rollback complete."
            else
              echo "WARNING: No previous image to roll back to."
            fi
            exit 1
