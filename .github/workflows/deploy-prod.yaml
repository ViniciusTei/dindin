name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: viniciustei/financeiro-remix
  MIGRATE_IMAGE_NAME: viniciustei/financeiro-remix-migrate

jobs:
  build-and-push:
    name: Build & Push Docker Images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.images.outputs.web_image }}
      migrate_image: ${{ steps.images.outputs.migrate_image }}
      app_version: ${{ steps.deploy.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolver metadados do deploy
        id: deploy
        shell: bash
        run: |
          DEPLOY_COMMIT="$(node ./scripts/release/resolve-deploy-version.mjs --sha ${{ github.event.workflow_run.head_sha }})"
          DEPLOY_VERSION="$(node ./scripts/release/resolve-deploy-version.mjs --version ${{ github.event.workflow_run.head_sha }})"

          echo "commit=$DEPLOY_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$DEPLOY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolver nomes das imagens
        id: images
        shell: bash
        run: |
          echo "web_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "migrate_image=${{ env.REGISTRY }}/${{ env.MIGRATE_IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          build-args: |
            APP_VERSION=${{ steps.deploy.outputs.version }}
          tags: |
            ${{ steps.images.outputs.web_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: dev-deps
          push: true
          build-args: |
            APP_VERSION=${{ steps.deploy.outputs.version }}
          tags: |
            ${{ steps.images.outputs.migrate_image }}
            ${{ env.REGISTRY }}/${{ env.MIGRATE_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: deploy-prod-main
      cancel-in-progress: false
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_DIR }}/
          overwrite: true

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REGISTRY_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
          MIGRATE_IMAGE: ${{ needs.build-and-push.outputs.migrate_image }}
          APP_VERSION: ${{ needs.build-and-push.outputs.app_version }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USERNAME,GHCR_PAT,REGISTRY_IMAGE,MIGRATE_IMAGE,APP_VERSION,DEPLOY_DIR
          script: |
            set -e
            cd "$DEPLOY_DIR"

            set -a
            . ./.env.prod
            set +a

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            PREV_IMAGE=$(docker inspect financeiro-prod-web-1 --format='{{.Config.Image}}' 2>/dev/null || echo "")

            REGISTRY_IMAGE="$REGISTRY_IMAGE" \
            MIGRATE_IMAGE="$MIGRATE_IMAGE" \
            APP_VERSION="$APP_VERSION" \
            docker compose pull web migrate

            REGISTRY_IMAGE="$REGISTRY_IMAGE" \
            MIGRATE_IMAGE="$MIGRATE_IMAGE" \
            APP_VERSION="$APP_VERSION" \
            docker compose run --rm migrate

            REGISTRY_IMAGE="$REGISTRY_IMAGE" \
            MIGRATE_IMAGE="$MIGRATE_IMAGE" \
            APP_VERSION="$APP_VERSION" \
            docker compose up -d --no-deps web

            echo "Waiting for application to start..."
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:${APP_PORT:-3000}/health" > /dev/null; then
                echo "Health check passed. Deploy successful."
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 10s..."
              sleep 10
            done

            echo "Health check failed."
            if [ -n "$PREV_IMAGE" ]; then
              echo "Rolling back web to: $PREV_IMAGE"
              MIGRATE_IMAGE="$MIGRATE_IMAGE" \
              REGISTRY_IMAGE="$PREV_IMAGE" \
              APP_VERSION="$APP_VERSION" \
              docker compose up -d --no-deps web
              echo "Rollback complete."
            else
              echo "WARNING: No previous image to roll back to."
            fi
            exit 1
