name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Rodar testes de domínio
        env:
          CI: true
        run: npm run test:domain

      - name: Rodar testes de UI
        env:
          CI: true
        run: npm run test:ui

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
