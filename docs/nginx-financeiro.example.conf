# Exemplo Nginx (host VPS) fazendo reverse proxy para os containers
# Ajuste domínio, paths de certificado e portas.

# Requisitos no proxy:
# - Encaminhar headers X-Forwarded-* (para o app gerar links corretos)
# - Aumentar limite/timeouts (PRD menciona uploads até 500MB)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name dev-financeiro.viniserver.com.br;

  # opcional: redirecionar HTTP -> HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name dev-financeiro.viniserver.com.br;

  # ssl_certificate /etc/letsencrypt/live/dev-financeiro.viniserver.com.br/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/dev-financeiro.viniserver.com.br/privkey.pem;

  client_max_body_size 600m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}

server {
  listen 80;
  server_name financeiro.viniserver.com.br;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name financeiro.viniserver.com.br;

  # ssl_certificate /etc/letsencrypt/live/financeiro.viniserver.com.br/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/financeiro.viniserver.com.br/privkey.pem;

  client_max_body_size 600m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
